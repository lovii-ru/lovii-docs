<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Приёмка экранов ЛОВИ — T-033 (ОК / требует правок / сырой)</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c1e21;--mut:#69707a;--line:#e3e6ea;
--ok:#1e9e6a;--fix:#e0a100;--raw:#d64545;--acc:#0f8a8a}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:15px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
.app{display:grid;grid-template-columns:1fr 380px;height:100vh}
@media (max-width:900px){.app{grid-template-columns:1fr;grid-template-rows:auto 1fr}.side{order:-1;max-height:45vh}}

/* ── левая колонка: текущий экран ── */
.main{display:flex;flex-direction:column;height:100vh}
.mhead{display:flex;gap:10px;align-items:center;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
.mhead h1{font-size:16px;margin:0;flex:1 1 240px}
.mhead button{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
#prog{font-weight:600;color:var(--mut)}
.scroll{overflow:auto;flex:1;padding:16px}
.stage{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;max-width:860px;margin:0 auto}
.stage img{width:100%;display:block}
.shot{text-align:center}
.shot figcaption{font-size:12px;color:var(--mut);padding:4px}
.extras{display:flex;gap:6px;flex-wrap:wrap;padding:8px;justify-content:center}
.extras button{font:inherit;font-size:12px;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
.extras button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.meta{padding:12px 16px;border-top:1px solid var(--line)}
.meta h2{margin:0 0 2px;font-size:18px}
.meta .id{color:var(--acc);font-weight:700}
.meta .route{color:var(--mut);font-size:13px}
.meta a{color:var(--acc)}
.vrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.vrow button{flex:1 1 120px;font:inherit;font-weight:600;padding:10px;border-radius:10px;border:2px solid transparent;cursor:pointer;background:#fff}
.v-ok.on{border-color:var(--ok);color:var(--ok);background:#eafaf3}
.v-fix.on{border-color:var(--fix);color:#8a6200;background:#fff8e6}
.v-raw.on{border-color:var(--raw);color:var(--raw);background:#fdeeee}
textarea{width:100%;min-height:64px;margin-top:10px;font:inherit;padding:8px;border:1px solid var(--line);border-radius:10px}
.hint{font-size:12px;color:var(--mut);margin-top:8px}

/* ── правая колонка: список + вердикты ── */
.side{background:var(--card);border-left:1px solid var(--line);display:flex;flex-direction:column;height:100vh}
.shead{padding:12px 14px;border-bottom:1px solid var(--line)}
.shead h2{margin:0 0 6px;font-size:14px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.shead select{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;width:100%}
.slist{overflow:auto;flex:1}
.slist table{width:100%;border-collapse:collapse;font-size:13px}
.slist tr{cursor:pointer}
.slist tr:hover{background:#f2f7f7}
.slist tr.cur{background:#e8f4f4;box-shadow:inset 3px 0 0 var(--acc)}
.slist td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.slist .t{font-weight:600}
.slist .v{font-size:12px;color:var(--mut)}
.badge{padding:1px 8px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.b-ok{background:#eafaf3;color:var(--ok)}.b-fix{background:#fff8e6;color:#8a6200}.b-raw{background:#fdeeee;color:var(--raw)}.b-none{background:#f0f1f3;color:var(--mut)}
.note-td{color:#8a6200;font-size:12px}
.sfoot{border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap}
.sfoot button,.sfoot label{font:inherit;font-size:13px;padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer}
.sfoot label input{display:none}
#exportOut{width:100%;height:120px;margin-top:8px;display:none;font:12px monospace}
</style>
</head>
<body>
<div class="app">
  <!-- ЛЕВАЯ: экран -->
  <section class="main">
    <div class="mhead">
      <h1>Приёмка экранов · T-033</h1>
      <span id="prog"></span>
      <button id="prev">←</button>
      <button id="next">→</button>
    </div>
    <div class="scroll">
      <div class="stage">
        <div class="shot"><figure><img id="img" alt=""><figcaption id="imgcap"></figcaption></figure>
          <div class="extras" id="extras"></div></div>
        <div class="meta">
          <h2><span class="id" id="pid"></span> <span id="ptitle"></span></h2>
          <div class="route" id="pver"></div>
          <div><a id="cardlink" target="_blank">Карточка канона ↗</a></div>
          <div class="vrow">
            <button class="v-ok" data-v="ok">✅ ОК</button>
            <button class="v-fix" data-v="fix">✏️ Требует правок</button>
            <button class="v-raw" data-v="raw">🚧 Сырой</button>
          </div>
          <textarea id="note" placeholder="Комментарий: что именно править / что не так (обязательно для «правок» и «сырого»)"></textarea>
          <div class="hint">Вердикты сохраняются автоматически (в этом браузере). По завершении — «Экспорт вердиктов» справа, файл передай агенту. Клавиши: ← → · 1 ОК · 2 правки · 3 сырой.</div>
        </div>
      </div>
    </div>
  </section>

  <!-- ПРАВАЯ: список и вердикты -->
  <aside class="side">
    <div class="shead">
      <h2>Экраны и вердикты</h2>
      <select id="group"></select>
    </div>
    <div class="slist" id="listbody"></div>
    <div class="sfoot">
      <button id="exportBtn">⬇️ Экспорт JSON</button>
      <label>⬆️ Импорт<input type="file" id="importFile" accept=".json"></label>
      <button id="resetBtn">Сброс</button>
      <textarea id="exportOut" readonly></textarea>
    </div>
  </aside>
</div>
<script>
const LS="t033-verdicts-v1";
let data=null, verdicts={}, cur=0, extraIdx=0;
try{verdicts=JSON.parse(localStorage.getItem(LS)||"{}")}catch(e){verdicts={}}
fetch("manifest.json").then(r=>r.json()).then(j=>{
  data=j.items;
  const gsel=document.getElementById("group");
  const all=document.createElement("option");all.value="";all.textContent="Все группы ("+data.length+")";gsel.appendChild(all);
  [...new Set(data.map(x=>x.group))].forEach(g=>{
    const o=document.createElement("option");o.value=g;o.textContent=g;gsel.appendChild(o);
  });
  gsel.addEventListener("change",()=>{cur=0;render();renderList()});
  renderList();render();
});
function curList(){const g=document.getElementById("group").value;return data.map((x,i)=>({x,i})).filter(p=>!g||p.x.group===g)}
function shortTitle(it){return it.title.replace(new RegExp("^"+it.id+"\\s*[—–-]?\\s*"),"")}
function render(){
  if(!data)return;
  const it=data[cur];
  document.getElementById("pid").textContent=it.id;
  document.getElementById("ptitle").textContent=shortTitle(it);
  document.getElementById("pver").textContent="версия "+it.version+" · "+it.group;
  document.getElementById("cardlink").href=it.card;
  extraIdx=0;showImg(it);
  const ex=document.getElementById("extras");ex.innerHTML="";
  if(it.extras&&it.extras.length){it.extras.forEach((p,k)=>{const b=document.createElement("button");b.textContent="кадр "+(k+2);b.onclick=()=>{extraIdx=k+1;showImg(it);[...ex.children].forEach(c=>c.classList.remove("on"));b.classList.add("on")};ex.appendChild(b)})}
  const v=verdicts[it.id]||{};
  document.querySelectorAll(".vrow button").forEach(b=>b.classList.toggle("on",b.dataset.v===v.verdict));
  document.getElementById("note").value=v.note||"";
  document.getElementById("prog").textContent=Object.keys(verdicts).length+" / "+data.length;
}
function showImg(it){
  const main=it.img;
  document.getElementById("img").src=extraIdx>0?it.extras[extraIdx-1]:main;
  document.getElementById("imgcap").textContent=(extraIdx>0?"доп. кадр "+(extraIdx+1):"основной кадр")+" · "+it.id+" · "+it.version;
}
function setVerdict(vv){
  const it=data[cur];
  verdicts[it.id]=Object.assign({id:it.id,title:it.title,version:it.version},verdicts[it.id]||{},{verdict:vv,note:document.getElementById("note").value,at:new Date().toISOString()});
  save();render();renderList();if(vv!=="ok")return; /* для «правок/сырого» остаёмся — пишем комментарий */
  setTimeout(()=>{const l=curList();const p=l.findIndex(q=>q.i===cur);if(p<l.length-1){cur=l[p+1].i;render();renderList();scrollList()}},250);
}
function save(){localStorage.setItem(LS,JSON.stringify(verdicts));renderList()}
function next(){const l=curList();const p=l.findIndex(q=>q.i===cur);if(p<l.length-1){cur=l[p+1].i;render();renderList();scrollList()}}
function prev(){const l=curList();const p=l.findIndex(q=>q.i===cur);if(p>0){cur=l[p-1].i;render();renderList();scrollList()}}
function scrollList(){const tr=document.querySelector("#listbody tr.cur");if(tr)tr.scrollIntoView({block:"nearest"})}
document.querySelectorAll(".vrow button").forEach(b=>b.onclick=()=>setVerdict(b.dataset.v));
document.getElementById("note").addEventListener("change",()=>{
  const it=data[cur];verdicts[it.id]=Object.assign({id:it.id,title:it.title,version:it.version},verdicts[it.id]||{});
  verdicts[it.id].note=document.getElementById("note").value;verdicts[it.id].at=new Date().toISOString();save();
});
document.getElementById("next").onclick=next;document.getElementById("prev").onclick=prev;
document.getElementById("exportBtn").onclick=()=>{
  const out={task:"T-033",exported:new Date().toISOString(),total:data.length,reviewed:Object.keys(verdicts).length,
    counts:{ok:Object.values(verdicts).filter(v=>v.verdict==="ok").length,fix:Object.values(verdicts).filter(v=>v.verdict==="fix").length,raw:Object.values(verdicts).filter(v=>v.verdict==="raw").length},
    verdicts:Object.values(verdicts).sort((a,b)=>a.id<b.id?-1:1)};
  const s=JSON.stringify(out,null,1);const o=document.getElementById("exportOut");o.style.display="block";o.value=s;
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([s],{type:"application/json"}));a.download="t033-verdicts.json";a.click();};
document.getElementById("importFile").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{const j=JSON.parse(t);(j.verdicts||[]).forEach(v=>verdicts[v.id]=v);save();render()})});
document.getElementById("resetBtn").onclick=()=>{if(confirm("Сбросить все вердикты в этом браузере?")){verdicts={};save();render()}};
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="TEXTAREA"||e.target.tagName==="INPUT"||e.target.tagName==="SELECT")return;
  if(e.key==="ArrowRight")next();else if(e.key==="ArrowLeft")prev();
  else if(e.key==="1")setVerdict("ok");else if(e.key==="2")setVerdict("fix");else if(e.key==="3")setVerdict("raw");});
function badgeOf(v){return v?{ok:["b-ok","✅ ОК"],fix:["b-fix","✏️ правки"],raw:["b-raw","🚧 сырой"]}[v.verdict]:["b-none","—"]}
function renderList(){
  const l=curList();
  document.getElementById("listbody").innerHTML="<table>"+l.map(q=>{
    const v=verdicts[q.x.id];const b=badgeOf(v);
    return `<tr class="${q.i===cur?"cur":""}" onclick="jump(${q.i})"><td><span class="t">${q.x.id}</span><br><span class="v">${shortTitle(q.x)}</span>${v&&v.note?`<br><span class="note-td">✏️ ${v.note.length>50?v.note.slice(0,50)+"…":v.note}</span>`:""}</td><td>${b[1]?`<span class="badge ${b[0]}">${b[1]}</span>`:""}</td></tr>`}).join("")+"</table>";
}
window.jump=i=>{cur=i;render();renderList();document.querySelector(".scroll").scrollTop=0};
</script>
</body>
</html>
