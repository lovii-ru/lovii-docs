const $ = s => document.querySelector(s);
const state = { group:null, q:'', allVersions:false, onlyStates:false };

function frameCode(item, ver, fr) { return `${item.id} · ${ver.version} · ${fr.state}`; }

function renderNav() {
  const nav = $('#nav'); nav.innerHTML = '';
  const mk = (label, g, cnt) => {
    const div = document.createElement('div'); div.className = 'grp';
    const b = document.createElement('button'); b.textContent = label;
    const c = document.createElement('span'); c.className = 'cnt'; c.textContent = cnt; b.appendChild(c);
    b.onclick = () => { state.group = g; renderAll(); };
    if (state.group === g) b.classList.add('on');
    div.appendChild(b); nav.appendChild(div);
  };
  mk('Все разделы', null, M.counts.pages + M.counts.modals);
  for (const g of M.groups) mk(g, g, M.items.filter(i => i.group === g).length);
}

function match(item) {
  if (state.group && item.group !== state.group) return false;
  if (!state.q) return true;
  const q = state.q.toLowerCase();
  if (item.id.toLowerCase().includes(q) || item.title.toLowerCase().includes(q) || item.slug.toLowerCase().includes(q)) return true;
  return item.versions.some(v => v.frames.some(f => (f.state + ' ' + (f.code ?? '')).toLowerCase().includes(q)));
}

function visibleFrames(item, ver) {
  let fs = ver.frames;
  if (state.onlyStates && ver === item.versions.at(-1)) fs = fs.filter(f => !f.is_default);
  return fs;
}

function renderAll() {
  renderNav();
  const list = $('#list'); list.innerHTML = '';
  const items = M.items.filter(match);
  $('#tb').innerHTML = `<span class="badge">показано ${items.length} из ${M.items.length}</span>
    <span class="badge">кадров всего: ${M.counts.frames} · версий: ${M.counts.versions}</span>
    <span class="badge">сборка: ${M.generated}</span>`;
  if (!items.length) { list.innerHTML = '<div class="empty">Ничего не найдено</div>'; return; }
  for (const item of items) list.appendChild(item.kind === 'page' ? renderPage(item) : renderModal(item));
}

function renderPage(item) {
  const el = document.createElement('section'); el.className = 'page';
  const last = item.versions.at(-1);
  const forced = item.versions.find(v => v.version === item._force) ?? null;
  const versions = forced ? [forced] : (state.allVersions ? item.versions : [last]);
  const route = last.route ? ` · ${last.route}` : '';
  el.innerHTML = `<div class="page-h"><span class="pid">${item.id}</span><span class="ptitle">${item.title}</span>
      <span class="proute">${route}</span>
      <span class="pcard">${item.card_local ? `<a href="${item.card_local}">карточка канона →</a>` : ''}</span></div>`;
  for (const ver of versions) {
    const fs = visibleFrames(item, ver);
    const bar = document.createElement('div'); bar.className = 'vbar';
    if (state.allVersions) {
      bar.innerHTML = `<span class="vmeta">${ver.version} · ${ver.date}${ver.stand ? ' · ' + ver.stand : ''}${ver.profile ? ' · 👤 ' + ver.profile : ''}${ver.notes ? ' · ' + ver.notes : ''}</span>`;
    } else {
      bar.innerHTML = `<span class="vmeta">${ver.date}${ver.stand ? ' · ' + ver.stand : ''}${ver.profile ? ' · 👤 ' + ver.profile : ''}${ver.notes ? ' · ' + ver.notes : ''}</span>`;
    }
    // переключатель версий: клик по версии = показать только её
    for (const v of item.versions) {
      const b = document.createElement('button'); b.className = 'vbtn' + (v === ver ? ' on' : ''); b.textContent = v.version;
      b.onclick = () => { state.allVersions = false; $('#allVersions').checked = false; item._force = (item._force === v.version) ? null : v.version; renderAll(); };
      bar.appendChild(b);
    }
    if (item.versions.length > 1 && !state.allVersions && !item._force) {
      const b = document.createElement('button'); b.className = 'vbtn'; b.textContent = 'история (' + item.versions.length + ')';
      b.onclick = () => { item._force = item.id; state.allVersions = true; $('#allVersions').checked = true; renderAll(); };
      bar.appendChild(b);
    }
    el.appendChild(bar);
    const grid = document.createElement('div'); grid.className = 'frames';
    for (const fr of fs) grid.appendChild(renderFrame(item, ver, fr));
    if (!fs.length) grid.innerHTML = '<div class="empty" style="padding:8px">развёрток не снято</div>';
    el.appendChild(grid);
  }
  return el;
}

function renderFrame(item, ver, fr) {
  const d = document.createElement('div'); d.className = 'frame';
  const code = frameCode(item, ver, fr);
  d.innerHTML = `<img loading="lazy" src="${fr.img}" alt="${code}">`;
  const fid = document.createElement('div'); fid.className = 'fid';
  fid.innerHTML = `<span>${code}</span><button class="cp" title="скопировать код для ревью">⧉</button>`;
  fid.querySelector('.cp').onclick = (e) => { e.stopPropagation(); navigator.clipboard?.writeText(code); e.target.textContent = '✓'; setTimeout(() => e.target.textContent = '⧉', 900); };
  d.appendChild(fid);
  if (fr.code) { const c = document.createElement('div'); c.className = 'fcode'; c.textContent = fr.code; d.appendChild(c); }
  d.onclick = () => { $('#lb').style.display = 'flex'; $('#lbImg').src = fr.img; $('#lbCap').textContent = code + (fr.note ? ' — ' + fr.note : ''); };
  return d;
}

function renderModal(item) {
  const el = document.createElement('div'); el.className = 'modal-row';
  el.innerHTML = `<span class="pid">${item.id}</span> <span class="ptitle">${item.title}</span>
    <span class="pcard">${item.card_local ? `<a href="${item.card_local}">карточка канона →</a>` : ''}</span>
    <div class="vmeta" style="margin-top:6px">кадров пока не снято — добавить через screens-publish (APP-M)</div>`;
  return el;
}

$('#q').oninput = e => { state.q = e.target.value.trim(); renderAll(); };
$('#allVersions').onchange = e => { state.allVersions = e.target.checked; renderAll(); };
$('#onlyStates').onchange = e => { state.onlyStates = e.target.checked; renderAll(); };
$('#lb').onclick = () => { $('#lb').style.display = 'none'; };
renderAll();
</script>
