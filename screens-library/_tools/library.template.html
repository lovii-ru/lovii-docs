<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Библиотека экранов LOVII — единый корпус (APP-P · развёртки · версии)</title>
<style>
  :root { --bg:#0e1116; --panel:#161b23; --card:#1c232e; --line:#2a3342; --txt:#e7ecf3; --dim:#93a1b5; --acc:#4fb3ff; --ok:#3ecf8e; --warn:#ffb454; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:14px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif; display:flex; min-height:100vh; }
  aside { width:270px; min-width:270px; background:var(--panel); border-right:1px solid var(--line); padding:16px 14px; position:sticky; top:0; height:100vh; overflow:auto; }
  h1 { font-size:15px; margin:0 0 4px; } .sub { color:var(--dim); font-size:11.5px; margin-bottom:12px; }
  #q { width:100%; padding:8px 10px; background:var(--bg); border:1px solid var(--line); border-radius:8px; color:var(--txt); margin-bottom:12px; font-size:13px; }
  .grp { margin-bottom:4px; } .grp > button { width:100%; text-align:left; background:none; border:0; color:var(--txt); padding:7px 8px; border-radius:7px; cursor:pointer; font-size:13px; display:flex; justify-content:space-between; }
  .grp > button:hover { background:var(--card); } .grp > button.on { background:var(--card); color:var(--acc); }
  .cnt { color:var(--dim); font-size:11px; }
  .opts { margin-top:10px; border-top:1px solid var(--line); padding-top:10px; font-size:12px; color:var(--dim); }
  .opts label { display:flex; gap:7px; align-items:center; margin:6px 0; cursor:pointer; }
  main { flex:1; padding:20px 26px 60px; }
  .toolbar { display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
  .badge { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:3px 11px; font-size:12px; color:var(--dim); }
  .page { background:var(--card); border:1px solid var(--line); border-radius:12px; margin-bottom:18px; overflow:hidden; }
  .page-h { padding:12px 16px; display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; border-bottom:1px solid var(--line); }
  .pid { font-family:ui-monospace,Menlo,monospace; color:var(--acc); font-size:13.5px; }
  .ptitle { font-weight:600; }
  .proute { color:var(--dim); font-size:12px; font-family:ui-monospace,Menlo,monospace; }
  .pcard { margin-left:auto; font-size:12px; color:var(--dim); } .pcard a { color:var(--dim); }
  .vbar { padding:8px 16px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .vbtn { background:var(--bg); border:1px solid var(--line); color:var(--txt); border-radius:7px; padding:4px 11px; cursor:pointer; font-size:12px; font-family:ui-monospace,Menlo,monospace; }
  .vbtn.on { border-color:var(--acc); color:var(--acc); }
  .vmeta { color:var(--dim); font-size:11.5px; }
  .frames { display:flex; flex-wrap:wrap; gap:12px; padding:4px 16px 16px; }
  .frame { width:236px; background:var(--bg); border:1px solid var(--line); border-radius:9px; overflow:hidden; cursor:zoom-in; }
  .frame img { width:100%; display:block; }
  .fid { display:flex; align-items:center; gap:6px; padding:7px 9px; font-family:ui-monospace,Menlo,monospace; font-size:10.5px; color:var(--dim); border-top:1px solid var(--line); }
  .fid .cp { margin-left:auto; border:0; background:none; color:var(--acc); cursor:pointer; font-size:10.5px; padding:0; }
  .fcode { padding:0 9px 8px; font-size:10.5px; color:var(--warn); font-family:ui-monospace,Menlo,monospace; white-space:pre-wrap; word-break:break-word; }
  .empty { color:var(--dim); padding:40px; text-align:center; }
  #lb { position:fixed; inset:0; background:rgba(0,0,0,.88); display:none; align-items:center; justify-content:center; flex-direction:column; gap:12px; z-index:9; cursor:zoom-out; }
  #lb img { max-width:94vw; max-height:86vh; border-radius:8px; }
  #lb .cap { font-family:ui-monospace,Menlo,monospace; color:var(--txt); font-size:13px; }
  .modal-row { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 16px; margin-bottom:12px; }
</style>
</head>
<body>
<aside>
  <h1>Библиотека экранов</h1>
  <div class="sub">единый корпус · append-only · генерируется build-library.mjs</div>
  <input id="q" placeholder="Поиск: ID, название, код кадра…">
  <nav id="nav"></nav>
  <div class="opts">
    <label><input type="checkbox" id="allVersions"> показывать все версии (история)</label>
    <label><input type="checkbox" id="onlyStates"> только развёртки (кадры состояний)</label>
  </div>
</aside>
<main>
  <div class="toolbar" id="tb"></div>
  <div id="list"></div>
</main>
<div id="lb"><div class="cap" id="lbCap"></div><img id="lbImg" alt=""></div>
<script>
const M = /*__MANIFEST__*/null;
const $ = s => document.querySelector(s);
const state = { group:null, q:'', allVersions:false, onlyStates:false };

function frameCode(item, ver, fr) { return `${item.id} · ${ver.version} · ${fr.state}`; }

function renderNav() {
  const nav = $('#nav'); nav.innerHTML = '';
  const mk = (label, g, cnt) => {
    const div = document.createElement('div'); div.className = 'grp';
    const b = document.createElement('button'); b.textContent = label;
    const c = document.createElement('span'); c.className = 'cnt'; c.textContent = cnt; b.appendChild(c);
    b.onclick = () => { state.group = g; renderAll(); };
    if (state.group === g) b.classList.add('on');
    div.appendChild(b); nav.appendChild(div);
  };
  mk('Все разделы', null, M.counts.pages + M.counts.modals);
  for (const g of M.groups) mk(g, g, M.items.filter(i => i.group === g).length);
}

function match(item) {
  if (state.group && item.group !== state.group) return false;
  if (!state.q) return true;
  const q = state.q.toLowerCase();
  if (item.id.toLowerCase().includes(q) || item.title.toLowerCase().includes(q) || item.slug.toLowerCase().includes(q)) return true;
  return item.versions.some(v => v.frames.some(f => (f.state + ' ' + (f.code ?? '')).toLowerCase().includes(q)));
}

function visibleFrames(item, ver) {
  let fs = ver.frames;
  if (state.onlyStates && ver === item.versions.at(-1)) fs = fs.filter(f => !f.is_default);
  return fs;
}

function renderAll() {
  renderNav();
  const list = $('#list'); list.innerHTML = '';
  const items = M.items.filter(match);
  $('#tb').innerHTML = `<span class="badge">показано ${items.length} из ${M.items.length}</span>
    <span class="badge">кадров всего: ${M.counts.frames} · версий: ${M.counts.versions}</span>
    <span class="badge">сборка: ${M.generated}</span>`;
  if (!items.length) { list.innerHTML = '<div class="empty">Ничего не найдено</div>'; return; }
  for (const item of items) list.appendChild(item.kind === 'page' ? renderPage(item) : renderModal(item));
}

function renderPage(item) {
  const el = document.createElement('section'); el.className = 'page';
  const last = item.versions.at(-1);
  const forced = item.versions.find(v => v.version === item._force) ?? null;
  const versions = forced ? [forced] : (state.allVersions ? item.versions : [last]);
  const route = last.route ? ` · ${last.route}` : '';
  el.innerHTML = `<div class="page-h"><span class="pid">${item.id}</span><span class="ptitle">${item.title}</span>
      <span class="proute">${route}</span>
      <span class="pcard">${item.card_local ? `<a href="${item.card_local}">карточка канона →</a>` : ''}</span></div>`;
  for (const ver of versions) {
    const fs = visibleFrames(item, ver);
    const bar = document.createElement('div'); bar.className = 'vbar';
    if (state.allVersions) {
      bar.innerHTML = `<span class="vmeta">${ver.version} · ${ver.date}${ver.stand ? ' · ' + ver.stand : ''}${ver.profile ? ' · 👤 ' + ver.profile : ''}${ver.notes ? ' · ' + ver.notes : ''}</span>`;
    } else {
      bar.innerHTML = `<span class="vmeta">${ver.date}${ver.stand ? ' · ' + ver.stand : ''}${ver.profile ? ' · 👤 ' + ver.profile : ''}${ver.notes ? ' · ' + ver.notes : ''}</span>`;
    }
    // переключатель версий: клик по версии = показать только её
    for (const v of item.versions) {
      const b = document.createElement('button'); b.className = 'vbtn' + (v === ver ? ' on' : ''); b.textContent = v.version;
      b.onclick = () => { state.allVersions = false; $('#allVersions').checked = false; item._force = (item._force === v.version) ? null : v.version; renderAll(); };
      bar.appendChild(b);
    }
    if (item.versions.length > 1 && !state.allVersions && !item._force) {
      const b = document.createElement('button'); b.className = 'vbtn'; b.textContent = 'история (' + item.versions.length + ')';
      b.onclick = () => { item._force = item.id; state.allVersions = true; $('#allVersions').checked = true; renderAll(); };
      bar.appendChild(b);
    }
    el.appendChild(bar);
    const grid = document.createElement('div'); grid.className = 'frames';
    for (const fr of fs) grid.appendChild(renderFrame(item, ver, fr));
    if (!fs.length) grid.innerHTML = '<div class="empty" style="padding:8px">развёрток не снято</div>';
    el.appendChild(grid);
  }
  return el;
}

function renderFrame(item, ver, fr) {
  const d = document.createElement('div'); d.className = 'frame';
  const code = frameCode(item, ver, fr);
  d.innerHTML = `<img loading="lazy" src="${fr.img}" alt="${code}">`;
  const fid = document.createElement('div'); fid.className = 'fid';
  fid.innerHTML = `<span>${code}</span><button class="cp" title="скопировать код для ревью">⧉</button>`;
  fid.querySelector('.cp').onclick = (e) => { e.stopPropagation(); navigator.clipboard?.writeText(code); e.target.textContent = '✓'; setTimeout(() => e.target.textContent = '⧉', 900); };
  d.appendChild(fid);
  if (fr.code) { const c = document.createElement('div'); c.className = 'fcode'; c.textContent = fr.code; d.appendChild(c); }
  d.onclick = () => { $('#lb').style.display = 'flex'; $('#lbImg').src = fr.img; $('#lbCap').textContent = code + (fr.note ? ' — ' + fr.note : ''); };
  return d;
}

function renderModal(item) {
  const el = document.createElement('div'); el.className = 'modal-row';
  el.innerHTML = `<span class="pid">${item.id}</span> <span class="ptitle">${item.title}</span>
    <span class="pcard">${item.card_local ? `<a href="${item.card_local}">карточка канона →</a>` : ''}</span>
    <div class="vmeta" style="margin-top:6px">кадров пока не снято — добавить через screens-publish (APP-M)</div>`;
  return el;
}

$('#q').oninput = e => { state.q = e.target.value.trim(); renderAll(); };
$('#allVersions').onchange = e => { state.allVersions = e.target.checked; renderAll(); };
$('#onlyStates').onchange = e => { state.onlyStates = e.target.checked; renderAll(); };
$('#lb').onclick = () => { $('#lb').style.display = 'none'; };
renderAll();
</script>
</body>
</html>
