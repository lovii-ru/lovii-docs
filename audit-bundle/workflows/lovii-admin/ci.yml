name: CI

permissions:
  contents: read
  packages: write

# Полный пайплайн (порт из бывшего .gitlab-ci.yml):
#   checks → lint (Pint+Rector) + PHPStan + type-coverage + Pest (Postgres/PostGIS)
#   deploy-staging (auto, push в staging) / deploy-production (manual) → SSH на сервер, git reset + docker compose build/migrate/up
# Проверки гоняются в Docker-образе target=ci (как в GitLab через $DOCKER_RUN).
#
# Где исполняется CI: переменная репозитория CI_RUNNER (Settings → Secrets and
# variables → Actions → Variables).
#   CI_RUNNER=self-hosted  → наш раннер gostiny-ci-* (сервер gostiny-prod-01; бесплатно, лимиты Actions не тратятся)
#   CI_RUNNER не задан     → ubuntu-latest (GitHub-hosted; вернуть при сбросе лимита биллинга)

on:
  push:
    branches: [master, staging]
    # Doc-only изменения не гоняют checks и не передеплоивают приложение — код не менялся.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'specs/**'
      - '.junie/**'
      - '.ai/**'
      - '.claude/**'
      - 'LICENSE'
  pull_request:
    # Doc-only изменения не гоняют checks и не передеплоивают приложение — код не менялся.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'specs/**'
      - '.junie/**'
      - '.ai/**'
      - '.claude/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_IMAGE: lovii-admin-ci-php:ci
  PG_IMAGE: imresamu/postgis:17-3.5-alpine

jobs:
  checks:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      # Уникальный суффикс docker-объектов прогона: на self-hosted раннере
      # тестовые Postgres/сети нескольких репо живут на одном docker-хосте.
      # Имя контейнера суффиксируется, но DNS-алиас остаётся стабильным
      # (pgsql-testing) — на него указывает DB_HOST в phpunit.xml.
      RUN_TAG: run-${{ github.run_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build CI image (target=ci)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: ci
          tags: ${{ env.CI_IMAGE }}
          load: true
          # gha-кэш имеет смысл только на GitHub-hosted раннерах (там нет
          # локальных слоёв); на self-hosted buildx кэширует локально сам.
          cache-from: ${{ vars.CI_RUNNER == 'self-hosted' && '' || 'type=gha' }}
          cache-to: ${{ vars.CI_RUNNER == 'self-hosted' && '' || 'type=gha,mode=max' }}

      - name: Cache Composer vendor
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Define docker run helper
        run: |
          echo "DOCKER_RUN=docker run --rm --user $(id -u):$(id -g) -e XDEBUG_MODE=off -v ${{ github.workspace }}:/app -w /app" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          $DOCKER_RUN $CI_IMAGE sh -c "\
            composer install --no-interaction --prefer-dist --no-progress \
            && cp .env.example .env \
            && php artisan key:generate"

      - name: Lint (Pint + Rector)
        run: |
          $DOCKER_RUN $CI_IMAGE sh -c "\
            vendor/bin/pint --parallel --test \
            && vendor/bin/rector --dry-run"

      # R-3.3 (волна 3 аудита): continue-on-error снят — красные тесты/PHPStan
      # блокируют деплой. Легаси-долг (121 mixed) зафиксирован baseline'ом
      # (phpstan-baseline.neon) — новые ошибки падают, старые не мешают.
      - name: Static analysis (PHPStan)
        run: $DOCKER_RUN $CI_IMAGE sh -c "vendor/bin/phpstan"

      - name: Type coverage
        run: |
          $DOCKER_RUN $CI_IMAGE sh -c "\
            vendor/bin/pest --type-coverage --min=70 --compact"

      - name: Start Postgres (PostGIS)
        run: |
          docker network create ci-net-$RUN_TAG || true
          docker run -d --name pgsql-testing-$RUN_TAG --network-alias pgsql-testing --network ci-net-$RUN_TAG \
            -e POSTGRES_DB=testing \
            -e POSTGRES_USER=sail \
            -e POSTGRES_PASSWORD=password \
            $PG_IMAGE
          docker run --rm --network ci-net-$RUN_TAG $PG_IMAGE \
            sh -c "until pg_isready -h pgsql-testing-$RUN_TAG -U sail -d testing; do sleep 1; done"
          # R-3.3: схема lovii_admin нужна в свежей тестовой БД (search_path
          # из config/database.php); локальная testing-база имеет её с ручных
          # времён — в CI создаём идемпотентно.
          docker run --rm --network ci-net-$RUN_TAG \
            -e PGPASSWORD=password $PG_IMAGE \
            sh -c "psql -h pgsql-testing-$RUN_TAG -U sail -d testing -c \"CREATE SCHEMA IF NOT EXISTS lovii_admin AUTHORIZATION sail\"" \
          && docker run --rm --network ci-net-$RUN_TAG --user $(id -u):$(id -g) \
            -v ${{ github.workspace }}:/app -w /app -e PGPASSWORD=password $CI_IMAGE \
            sh -c "PGPASSWORD=password psql -h pgsql-testing-$RUN_TAG -U sail -d testing -q -f tests/Support/core-schema.sql"

      - name: Tests (Pest + coverage)
        run: |
          docker run --rm --user $(id -u):$(id -g) \
            --network ci-net-$RUN_TAG \
            -e XDEBUG_MODE=coverage \
            -e DB_HOST=pgsql-testing-$RUN_TAG \
            -v ${{ github.workspace }}:/app -w /app \
            $CI_IMAGE sh -c "\
              vendor/bin/pest --parallel --coverage --min=70 --compact"

      - name: Build & push images (R-3.2)
        if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/master'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker build --pull -f docker/Dockerfile --target app -t ghcr.io/${{ github.repository_owner }}/lovii-admin-app:${{ github.sha }} .
          docker push ghcr.io/${{ github.repository_owner }}/lovii-admin-app:${{ github.sha }}
          docker tag ghcr.io/${{ github.repository_owner }}/lovii-admin-app:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/lovii-admin-app:latest
          docker push ghcr.io/${{ github.repository_owner }}/lovii-admin-app:latest
          docker build --pull -f docker/Dockerfile --target scheduler -t ghcr.io/${{ github.repository_owner }}/lovii-admin-scheduler:${{ github.sha }} .
          docker push ghcr.io/${{ github.repository_owner }}/lovii-admin-scheduler:${{ github.sha }}
          docker tag ghcr.io/${{ github.repository_owner }}/lovii-admin-scheduler:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/lovii-admin-scheduler:latest
          docker push ghcr.io/${{ github.repository_owner }}/lovii-admin-scheduler:latest
      - name: Cleanup Postgres
        if: always()
        run: |
          docker rm -f pgsql-testing-$RUN_TAG || true
          docker network rm ci-net-$RUN_TAG || true

  # ---------------------------------------------------------------------------
  # Деплой. Два окружения, один и тот же SSH-скрипт:
  #   deploy-staging    — АВТОМАТИЧЕСКИ на каждый push в ветку `staging`
  #   deploy-production — ВРУЧНУЮ: Actions → CI → Run workflow с ветки `master`
  # DEPLOY_PATH хранится в GitHub Environment (staging / production),
  # DEPLOY_SSH_KEY / DEPLOY_HOST / DEPLOY_USER — общие секреты репозитория.
  # Шаги продублированы намеренно: GitHub Actions не поддерживает YAML-anchors.
  # ---------------------------------------------------------------------------
  deploy-staging:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    environment:
      name: staging
      url: https://admin-staging.lovii.ru
    env:
      DEPLOY_BRANCH: staging
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_HOST }} ${{ vars.DEPLOY_HOST_KEY }}" >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "deploy lovii-admin-staging '${{ github.sha }}' '${{ github.event.before }}'"


      - name: Cleanup SSH key
        if: always()
        run: shred -u ~/.ssh/deploy_key 2>/dev/null || rm -f ~/.ssh/deploy_key

  deploy-production:
    needs: checks
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    environment:
      name: production
      url: https://admin.lovii.ru
    env:
      DEPLOY_BRANCH: master
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_HOST }} ${{ vars.DEPLOY_HOST_KEY }}" >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "deploy lovii-admin '${{ github.sha }}' '${{ github.event.before }}'"


      - name: Cleanup SSH key
        if: always()
        run: shred -u ~/.ssh/deploy_key 2>/dev/null || rm -f ~/.ssh/deploy_key
