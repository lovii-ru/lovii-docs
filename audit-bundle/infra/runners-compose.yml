services:
  # Раннеры в контейнерах (R-3.1, волна 3): изоляция от прод-стеков.
  # Каждому раннеру — свой dind (docker-in-docker) для сборок и своих job.
  # Хост-docker.sock НЕ монтируется нигде — прод-стеки из CI не видны.
  runner-core:
    image: ghcr.io/lovii-tech/ci-runner:latest
    container_name: gostiny-runner-core
    restart: unless-stopped
    environment:
      RUNNER_NAME: gostiny-ci-core-c
      RUNNER_REPO: lovii-tech/lovii-core
      RUNNER_TOKEN: (протухший registration token — см. canon/SECRETS_ROTATION.md)
      DOCKER_HOST: tcp://dind-core:2376
      DOCKER_TLS_CERTDIR: ""
      BUILDKIT_HOST: tcp://dind-core:1234
    volumes:
      - runner-core:/home/runner/_work
      - runner-cfg-core:/home/runner/config
    depends_on: [dind-core]
    networks: [net-core]

  dind-core:
    image: docker:27-dind
    container_name: gostiny-dind-core
    restart: unless-stopped
    privileged: true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          memory: 512M
    environment:
      DOCKER_TLS_CERTDIR: ""
    command: ["--host=tcp://0.0.0.0:2376", "--data-root=/dind-data"]
    volumes:
      - dind-core:/dind-data
      - runner-core:/home/runner/_work
      - runner-cfg-core:/home/runner/config
      - /home/deploy/ci-runners/dind-config/daemon.json:/etc/docker/daemon.json:ro
    networks: [net-core]

  runner-app:
    image: ghcr.io/lovii-tech/ci-runner:latest
    container_name: gostiny-runner-app
    restart: unless-stopped
    environment:
      RUNNER_NAME: gostiny-ci-app-c
      RUNNER_REPO: lovii-tech/lovii-app
      RUNNER_TOKEN: (протухший registration token — см. canon/SECRETS_ROTATION.md)
      DOCKER_HOST: tcp://dind-app:2376
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - runner-app:/home/runner/_work
      - runner-cfg-app:/home/runner/config
    depends_on: [dind-app]
    networks: [net-app]

  dind-app:
    image: docker:27-dind
    container_name: gostiny-dind-app
    restart: unless-stopped
    privileged: true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          memory: 512M
    environment:
      DOCKER_TLS_CERTDIR: ""
    command: ["--host=tcp://0.0.0.0:2376", "--data-root=/dind-data"]
    volumes:
      - dind-app:/dind-data
      - runner-app:/home/runner/_work
      - runner-cfg-app:/home/runner/config
      - /home/deploy/ci-runners/dind-config/daemon.json:/etc/docker/daemon.json:ro
    networks: [net-app]

  runner-b2b:
    image: ghcr.io/lovii-tech/ci-runner:latest
    container_name: gostiny-runner-b2b
    restart: unless-stopped
    environment:
      RUNNER_NAME: gostiny-ci-b2b-c
      RUNNER_REPO: lovii-tech/lovii-b2b
      RUNNER_TOKEN: (протухший registration token — см. canon/SECRETS_ROTATION.md)
      DOCKER_HOST: tcp://dind-b2b:2376
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - runner-b2b:/home/runner/_work
      - runner-cfg-b2b:/home/runner/config
    depends_on: [dind-b2b]
    networks: [net-b2b]

  dind-b2b:
    image: docker:27-dind
    container_name: gostiny-dind-b2b
    restart: unless-stopped
    privileged: true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          memory: 512M
    environment:
      DOCKER_TLS_CERTDIR: ""
    command: ["--host=tcp://0.0.0.0:2376", "--data-root=/dind-data"]
    volumes:
      - dind-b2b:/dind-data
      - runner-b2b:/home/runner/_work
      - runner-cfg-b2b:/home/runner/config
      - /home/deploy/ci-runners/dind-config/daemon.json:/etc/docker/daemon.json:ro
    networks: [net-b2b]

  runner-admin:
    image: ghcr.io/lovii-tech/ci-runner:latest
    container_name: gostiny-runner-admin
    restart: unless-stopped
    environment:
      RUNNER_NAME: gostiny-ci-admin-c
      RUNNER_REPO: lovii-tech/lovii-admin
      RUNNER_TOKEN: (протухший registration token — см. canon/SECRETS_ROTATION.md)
      DOCKER_HOST: tcp://dind-admin:2376
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - runner-admin:/home/runner/_work
      - runner-cfg-admin:/home/runner/config
    depends_on: [dind-admin]
    networks: [net-admin]

  dind-admin:
    image: docker:27-dind
    container_name: gostiny-dind-admin
    restart: unless-stopped
    privileged: true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          memory: 512M
    environment:
      DOCKER_TLS_CERTDIR: ""
    command: ["--host=tcp://0.0.0.0:2376", "--data-root=/dind-data"]
    volumes:
      - dind-admin:/dind-data
      - runner-admin:/home/runner/_work
      - runner-cfg-admin:/home/runner/config
      - /home/deploy/ci-runners/dind-config/daemon.json:/etc/docker/daemon.json:ro
    networks: [net-admin]

networks:
  net-core:
    name: lovii-ci-core
    driver: bridge
  net-app:
    name: lovii-ci-app
    driver: bridge
  net-b2b:
    name: lovii-ci-b2b
    driver: bridge
  net-admin:
    name: lovii-ci-admin
    driver: bridge
    # Отдельная сеть: без gateway-маршрутов в прод-стеки (все прод-стеки в
    # своих compose-сетях). Наружу только интернет (пул образов, GitHub).

volumes:
  runner-core: {}
  runner-cfg-core: {}
  runner-app: {}
  runner-cfg-app: {}
  runner-b2b: {}
  runner-cfg-b2b: {}
  runner-admin: {}
  runner-cfg-admin: {}
  dind-core: {}
  dind-app: {}
  dind-b2b: {}
  dind-admin: {}
